spring:
  application:
    name: bibmerge
  servlet:
    multipart:
      # Papers' PDFs can be large; .bib files are small.
      max-file-size: 50MB
      max-request-size: 200MB

server:
  # 8080 is often taken by other local services; override with --server.port=...
  port: 8091

logging:
  level:
    org.apache.pdfbox: ERROR
